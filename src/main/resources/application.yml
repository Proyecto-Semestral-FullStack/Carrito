spring:
  application:
    name: ms-carrito
  datasource:
    url: jdbc:mysql://localhost:3306/db_carrito
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30